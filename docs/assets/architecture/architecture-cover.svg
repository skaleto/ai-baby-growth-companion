<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">小宝记系统架构文档封面</title>
  <desc id="desc">面向技术人员的系统架构封面，展示移动端、API、Agent、数据和外部服务的分层关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: #93c5fd; stroke-width: 1; opacity: 0.12; }
      .panel { fill: url(#panel); stroke: rgba(255,255,255,0.22); stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .chip { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.22); stroke-width: 1; rx: 999; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .title { font-size: 52px; font-weight: 850; letter-spacing: 1px; }
      .subtitle { font-size: 22px; fill: #dbeafe; }
      .h { font-size: 22px; font-weight: 800; }
      .p { font-size: 16px; fill: #d1d5db; }
      .mono { font-size: 14px; fill: #bfdbfe; font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .line { stroke: #67e8f9; stroke-width: 3; fill: none; marker-end: url(#arrow); opacity: 0.85; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="520"/>
  <g>
    <path class="grid" d="M80 0V520M200 0V520M320 0V520M440 0V520M560 0V520M680 0V520M800 0V520M920 0V520M1040 0V520M1160 0V520M1280 0V520M1400 0V520M1520 0V520"/>
    <path class="grid" d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
  </g>
  <text class="text title" x="80" y="112">小宝记系统架构</text>
  <text class="text subtitle" x="82" y="152">Business · Technical · Deployment · Agent Runtime Design</text>
  <rect class="chip" x="82" y="184" width="150" height="38"/>
  <text class="text mono" x="110" y="209">React</text>
  <rect class="chip" x="250" y="184" width="185" height="38"/>
  <text class="text mono" x="278" y="209">Spring Boot</text>
  <rect class="chip" x="455" y="184" width="145" height="38"/>
  <text class="text mono" x="483" y="209">SQLite</text>
  <rect class="chip" x="620" y="184" width="125" height="38"/>
  <text class="text mono" x="650" y="209">OSS</text>
  <rect class="chip" x="765" y="184" width="190" height="38"/>
  <text class="text mono" x="793" y="209">Capacitor</text>

  <g transform="translate(105,300)">
    <rect class="panel" x="0" y="0" width="240" height="116" rx="18"/>
    <text class="text h" x="28" y="42">移动端体验</text>
    <text class="text p" x="28" y="74">聊天 / 记录 / 相册 / 提醒 / 账本</text>
  </g>
  <g transform="translate(455,300)">
    <rect class="panel" x="0" y="0" width="240" height="116" rx="18"/>
    <text class="text h" x="28" y="42">业务 API</text>
    <text class="text p" x="28" y="74">认证、状态、上传、OTA</text>
  </g>
  <g transform="translate(805,300)">
    <rect class="panel" x="0" y="0" width="240" height="116" rx="18"/>
    <text class="text h" x="28" y="42">Agent Harness</text>
    <text class="text p" x="28" y="74">规则、Planner、Skill、Policy</text>
  </g>
  <g transform="translate(1155,300)">
    <rect class="panel" x="0" y="0" width="300" height="116" rx="18"/>
    <text class="text h" x="28" y="42">数据与基础设施</text>
    <text class="text p" x="28" y="74">家庭共享、账号私有、对象存储</text>
  </g>
  <path class="line" d="M345 358H455"/>
  <path class="line" d="M695 358H805"/>
  <path class="line" d="M1045 358H1155"/>
</svg>
