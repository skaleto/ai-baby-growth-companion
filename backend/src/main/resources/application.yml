server:
  port: ${PORT:8080}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"

spring:
  application:
    name: baby-companion-backend

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost,https://localhost,capacitor://localhost}
  storage:
    data-dir: ${APP_DATA_DIR:}
    mode: ${APP_STORAGE_MODE:local}
    max-upload-bytes: ${APP_MAX_UPLOAD_BYTES:104857600}
    max-video-upload-bytes: ${APP_MAX_VIDEO_UPLOAD_BYTES:314572800}
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      object-prefix: ${ALIYUN_OSS_OBJECT_PREFIX:baby-companion}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:}}
      access-key-id-file: ${ALIYUN_OSS_ACCESS_KEY_ID_FILE:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:}}
      access-key-secret-file: ${ALIYUN_OSS_ACCESS_KEY_SECRET_FILE:}
      signed-url-ttl-seconds: ${ALIYUN_OSS_SIGNED_URL_TTL_SECONDS:86400}
      migrate-local-on-startup: ${ALIYUN_OSS_MIGRATE_LOCAL_ON_STARTUP:false}
  mobile-updates:
    enabled: ${APP_MOBILE_UPDATES_ENABLED:true}
    directory: ${APP_MOBILE_UPDATES_DIR:mobile-updates}
    public-base-url: ${APP_MOBILE_UPDATES_PUBLIC_BASE_URL:}

auth:
  jwt:
    secret-file: ${AUTH_JWT_SECRET_FILE:backend/data/auth/jwt_secret}
    ttl: ${AUTH_JWT_TTL:30d}
  invite-codes-file: ${AUTH_INVITE_CODES_FILE:backend/data/auth/invite_codes}
  max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:8}
  login-window: ${AUTH_LOGIN_WINDOW:10m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-key-file: ${DEEPSEEK_API_KEY_FILE:/Users/.deepseek_apikey}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  planner-model: ${DEEPSEEK_PLANNER_MODEL:deepseek-v4-flash}
  max-tokens: ${DEEPSEEK_MAX_TOKENS:800}
  agent-max-tokens: ${DEEPSEEK_AGENT_MAX_TOKENS:2000}
  temperature: ${DEEPSEEK_TEMPERATURE:0.4}
  connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:5s}
  read-timeout: ${DEEPSEEK_READ_TIMEOUT:45s}

doubao:
  api-key: ${DOUBAO_API_KEY:${ARK_API_KEY:}}
  api-key-file: ${DOUBAO_API_KEY_FILE:/Users/.doubao_apikey}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  chat-path: ${DOUBAO_CHAT_PATH:/chat/completions}
  seed20-lite-model: ${DOUBAO_SEED20_LITE_MODEL:doubao-seed-2-0-lite-260215}
  seed20-pro-model: ${DOUBAO_SEED20_PRO_MODEL:doubao-seed-2-0-pro-260215}
  low-latency-service-tier: ${DOUBAO_LOW_LATENCY_SERVICE_TIER:fast}
  connect-timeout: ${DOUBAO_CONNECT_TIMEOUT:5s}
  read-timeout: ${DOUBAO_READ_TIMEOUT:60s}
  asr:
    api-key: ${DOUBAO_ASR_API_KEY:}
    api-key-file: ${DOUBAO_ASR_API_KEY_FILE:/Users/.doubao_asr_key}
    endpoint: ${DOUBAO_ASR_ENDPOINT:wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async}
    resource-id: ${DOUBAO_ASR_RESOURCE_ID:volc.seedasr.sauc.duration}
    connect-timeout: ${DOUBAO_ASR_CONNECT_TIMEOUT:8s}
